name: Release

# Attaches the integration as bold.zip to each published release: HACS
# installs from it, and counts its downloads.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach bold.zip to, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the manifest's version matches the tag
        run: |
          version=$(jq -r .version custom_components/bold/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::manifest.json says $version, but the tag is $TAG"
            exit 1
          fi
      - name: Zip the integration
        # HACS expects the integration's files at the top of the zip.
        working-directory: custom_components/bold
        run: zip -r "$GITHUB_WORKSPACE/bold.zip" . -x "*__pycache__*"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" bold.zip --clobber
